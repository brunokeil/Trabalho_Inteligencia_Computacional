<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f6f3"><title>Locais de prova · DCC136 · Bruno Keil</title>
<style>
:root{--paper:#f7f6f3;--ink:#292c28;--muted:#676b64;--line:#dedfd8;--green:#346538;--red:#9f2f2d}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"Helvetica Neue",Arial,sans-serif;font-size:clamp(16px,1.65vw,23px);line-height:1.5}button,select,a{-webkit-tap-highlight-color:transparent}button,select{font:inherit;font-size:14px;min-height:42px;border:1px solid var(--line);border-radius:4px;padding:8px 14px;background:transparent;color:var(--ink);cursor:pointer;touch-action:manipulation}button:hover{background:#eaeae4}button:active{transform:scale(.98)}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:4px}button:disabled{opacity:.35;cursor:default}a{color:var(--green);text-underline-offset:4px}header{height:66px;display:flex;justify-content:space-between;align-items:center;padding:0 4vw;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.1em;text-transform:uppercase}header span:last-child{color:var(--muted)}main{max-width:1500px;margin:auto}.slide{display:none;min-height:calc(100svh - 144px);padding:32px 6vw 24px;position:relative}.slide.active{display:flex;flex-direction:column;justify-content:center;animation:none}.eyebrow,.caption{font:11px "SF Mono",Menlo,monospace;letter-spacing:.1em;color:var(--muted);margin-bottom:15px}.eyebrow{margin-top:0}h2{font:normal clamp(32px,4.4vw,66px)/1.03 Georgia,"Times New Roman",serif;letter-spacing:-.04em;margin:0 0 30px;max-width:1100px}h2 em{font-weight:normal;color:var(--green)}h3{font:normal clamp(23px,2.4vw,34px)/1.16 Georgia,serif;margin:14px 0}.lede{font-size:clamp(19px,2vw,28px);line-height:1.4;max-width:800px}p{margin:12px 0 20px}small,.muted{color:var(--muted)}small{font-size:.7em}.split{display:grid;grid-template-columns:1.12fr 1fr;gap:6vw;align-items:center}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:32px}.steps>div{border-top:1px solid var(--line);padding-top:20px}.steps p{font-size:.88em}.steps b{font-size:.8em}.formula{font:normal clamp(24px,3.1vw,44px) Georgia,serif;margin:28px 0;color:var(--green)}.smallformula{font-size:clamp(22px,2.6vw,36px);text-align:center;padding-top:20px;border-top:1px solid var(--line)}.callout{padding:22px 26px;background:#edf3ec;border-left:3px solid #b3c7b0;font-size:.88em}.big{font:normal clamp(62px,7vw,105px)/1 Georgia,serif;letter-spacing:-.05em;color:var(--green)}.rules>div{display:flex;align-items:center;gap:22px;padding:22px 0;border-bottom:1px solid var(--line)}.rules b{font:32px Georgia,serif;color:var(--green)}.rules span{font-size:.9em}.footnote{font-size:12px;line-height:1.5;color:var(--muted);margin:22px 0 0}.code,code{font-family:Menlo,"SF Mono",monospace;font-size:.7em}.code{font-size:clamp(18px,2.2vw,30px);line-height:1.6;padding:18px 0}.vector{display:flex;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:10px 0 28px}.vector span{flex:1;padding:16px;border-right:1px solid var(--line);font-size:.8em}.vector span:last-child{border:0}.vector b{font-size:1.8em;color:var(--green);font-weight:400}.tag{display:inline-block;font-size:10px;letter-spacing:.08em;padding:7px 9px;background:#eaeae4;white-space:normal}.green{background:#edf3ec;color:var(--green)}.red{background:#fdebec;color:var(--red)}.method{align-items:start}.nmark{font:40px Georgia,serif;color:var(--green)}.cover h2{font-size:clamp(44px,6.6vw,98px);max-width:1200px}.coverline{display:flex;justify-content:space-between;gap:24px;margin-top:35px;padding-top:25px;border-top:1px solid var(--line);font-size:14px}.coverline span:last-child{text-align:right}.example-toolbar,.result-toolbar{display:flex;gap:18px;align-items:center;margin-bottom:20px;flex-wrap:wrap}.example-toolbar{justify-content:space-between}.school{padding:14px 0;border-bottom:1px solid var(--line);font-size:18px}.school b{display:inline-block;min-width:100px}.school small{float:right;font-size:13px}.school p{margin:8px 0 0;font:14px Menlo,monospace}.metricline{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:14px 0;margin:0 0 22px;gap:16px}.metricline b{font:36px Georgia,serif;display:block;color:var(--green)}.metricline span{font-size:12px;color:var(--muted)}label{font-size:13px}select{max-width:100%;background:#fff}table{width:100%;border-collapse:collapse;font-size:clamp(12px,1.2vw,17px);font-variant-numeric:tabular-nums}th,td{text-align:right;padding:12px 8px;border-bottom:1px solid var(--line)}th{font-weight:400;color:var(--muted);font-size:12px}th:first-child,td:first-child{text-align:left}.tablewrap{overflow-x:auto}.closing{padding:30px;border:1px solid var(--line)}.closing a{font-size:15px}.closing p{font-size:.9em}svg{width:100%;height:auto;display:block}.notes{display:none;font-size:14px;line-height:1.6;background:#fbf3db;color:#655126;padding:14px 20px;margin-top:24px}.show-notes .active .notes{display:block}footer{height:78px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 4vw;font-size:12px}footer .controls{display:flex;gap:8px;align-items:center}#counter{min-width:58px;text-align:center;font:12px Menlo,monospace}.help{color:var(--muted);font-size:11px}#progress{position:fixed;bottom:0;left:0;height:3px;background:var(--green);width:100%;transform:scaleX(.08333);transform-origin:left;pointer-events:none}#timer{font:12px Menlo,monospace;min-width:48px}#live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@keyframes appear{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@media(min-width:801px) and (max-height:800px){body{font-size:16px}header{height:50px}.slide{min-height:calc(100svh - 110px);padding:18px 6vw}footer{height:60px;padding:8px 4vw}h2{font-size:45px;margin-bottom:19px}.cover h2{font-size:70px}.eyebrow,.caption{margin-bottom:10px}.lede{font-size:21px}p{margin:8px 0 13px}.formula{font-size:30px;margin:19px 0}.smallformula{font-size:28px;padding-top:14px}.callout{padding:15px 20px}.big{font-size:65px}.rules>div{padding:15px 0}.steps>div{padding-top:14px}.footnote{margin-top:14px;font-size:11px}.metricline{padding:10px 0;margin-bottom:16px}.metricline b{font-size:29px}th,td{padding:9px 7px}.example-toolbar,.result-toolbar{margin-bottom:15px}.school{padding:10px 0}.coverline{margin-top:26px;padding-top:20px}#convergence-chart svg{max-height:280px}.results th,.results td{padding:6px 7px}}
@media(max-width:800px){header{height:52px}.slide{min-height:calc(100svh - 132px);padding:26px 6vw}.split,.steps{grid-template-columns:1fr;gap:22px}h2{margin-bottom:24px}.coverline{margin-top:25px}.steps>div{padding-top:12px}.steps p{margin:8px 0}.metricline{grid-template-columns:repeat(2,1fr)}footer{height:auto;min-height:80px;flex-wrap:wrap}footer .help{display:none}.footnote{font-size:11px}.rules>div{padding:12px 0}.big{font-size:65px}.formula{margin:18px 0}.school{font-size:16px}.slide.active{justify-content:flex-start}header span:last-child{display:none}}
@media(prefers-reduced-motion:reduce){.slide.active{animation:none}button:active{transform:none}}
@media print{@page{size:A4 landscape;margin:12mm}body{font-size:15px;background:#fff}header,footer,#progress{display:none}.slide,.slide.active{display:flex!important;flex-direction:column;break-after:page;page-break-after:always;min-height:0;height:180mm;padding:5mm;justify-content:center;animation:none}.slide:last-child{break-after:auto}h2,.cover h2{font-size:39px;margin-bottom:20px}.split{grid-template-columns:1.12fr 1fr;gap:35px}.steps{grid-template-columns:repeat(3,1fr)}.lede{font-size:19px}.big{font-size:65px}.notes,.show-notes .active .notes{display:none}.metricline{grid-template-columns:repeat(4,1fr)}button,select,.offline-download{display:none}.footnote{font-size:10px}.metricline b{font-size:28px}.closing{padding:20px}table{font-size:12px}th,td{padding:8px}}
</style>
</head>
<body>
<header><span>UFJF / Inteligência Computacional</span><span>Localização de locais de prova · 2026.3</span></header>
<main><!-- SLIDES --></main>
<footer><div class="controls"><button id="prev" type="button" aria-label="Slide anterior">←</button><span id="counter"></span><button id="next" type="button" aria-label="Próximo slide">→</button></div><span class="help">← → navegar · N roteiro · F tela cheia · Home início</span><div class="controls"><span id="timer" aria-label="Tempo de apresentação">00:00</span><button id="start" type="button">Iniciar</button><button id="notes" type="button" aria-pressed="false">Roteiro</button><button id="print" type="button">PDF</button></div></footer>
<div id="progress"></div><div id="live" aria-live="polite"></div>
<script>
'use strict';
const results=/* RESULTS */;
const curves=/* CURVES */;
const slides=[...document.querySelectorAll('.slide')];
let current=0,started=null,elapsed=0;
const $=s=>document.querySelector(s);
const fmt=(v,d=2)=>Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
function show(index){current=Math.max(0,Math.min(slides.length-1,index));slides.forEach((s,i)=>{s.classList.toggle('active',i===current);s.setAttribute('aria-hidden',String(i!==current))});$('#counter').textContent=`${String(current+1).padStart(2,'0')} / ${slides.length}`;$('#prev').disabled=current===0;$('#next').disabled=current===slides.length-1;$('#progress').style.transform=`scaleX(${(current+1)/slides.length})`;$('#live').textContent=`Slide ${current+1}: ${slides[current].dataset.title.replaceAll('<br>',' ').replace(/<[^>]*>/g,'')}`;history.replaceState(null,'',`#${current+1}`);window.scrollTo(0,0)}
function toggleNotes(){document.body.classList.toggle('show-notes');$('#notes').setAttribute('aria-pressed',String(document.body.classList.contains('show-notes')))}
$('#prev').onclick=()=>show(current-1);$('#next').onclick=()=>show(current+1);$('#notes').onclick=toggleNotes;$('#print').onclick=()=>window.print();
document.addEventListener('keydown',e=>{if(e.target.closest('select,input,textarea,button')||e.ctrlKey||e.metaKey||e.altKey)return;if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(current+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(current-1)}if(e.key==='Home'){e.preventDefault();show(0)}if(e.key==='End'){e.preventDefault();show(slides.length-1)}if(e.key.toLowerCase()==='n')toggleNotes();if(e.key.toLowerCase()==='f'){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.().catch(()=>{});else document.exitFullscreen?.().catch(()=>{})}});
$('#start').onclick=()=>{if(started!==null){elapsed+=Date.now()-started;started=null;$('#start').textContent='Continuar'}else{started=Date.now();$('#start').textContent='Pausar'}};
setInterval(()=>{const t=Math.floor((elapsed+(started!==null?Date.now()-started:0))/1000);$('#timer').textContent=`${String(Math.floor(t/60)).padStart(2,'0')}:${String(t%60).padStart(2,'0')}`},500);
let improved=false;
function drawExample(){const schools=improved?[['E1 · M2','4 / 4','C5 · C6 · C7 · C8'],['E2 · M1','2 / 4','C2 · C4'],['E3 · M1','2 / 2','C1 · C3']]:[['E1 · M2','4 / 4','C5 · C6 · C7 · C8'],['E2 · M1','4 / 4','C1 · C2 · C3 · C4'],['E3 · —','0 / 2','Sem candidatos']];$('#school-demo').innerHTML=schools.map(s=>`<div class="school"><b>${s[0]}</b><small>carga ${s[1]}</small><p>${s[2]}</p></div>`).join('');$('#example-cost').innerHTML=`${improved?42:56} <small>km</small>`;$('#example-description').textContent=improved?'C3 e C1 passam para E3. Redução de 14 km: melhoria de 25%, com todos atendidos.':'O construtivo atende todos com E1 e E2. E3 permanece vazia.';$('#example-caption').textContent=improved?'N3 · HABILITAR M1 EM E3 E RECONSTRUIR':'CONSTRUÇÃO · E1/M2 E E2/M1';$('#example-toggle').textContent=improved?'← Ver construção':'Aplicar N3 →'}
$('#example-toggle').onclick=()=>{improved=!improved;drawExample()};drawExample();
const select=$('#instance-select');Object.keys(results).sort((a,b)=>results[a][1].vnd.label.localeCompare(results[b][1].vnd.label,'pt-BR',{numeric:true})).forEach(name=>{let opt=document.createElement('option');opt.value=name;opt.textContent=results[name][1].vnd.label;select.append(opt)});
function updateResults(){
 const groups=results[select.value];
 const status=K=>groups[K].vnd.unassigned?`K=${K}: parcial (${groups[K].vnd.unassigned} não alocados)`:`K=${K}: completa`;
 $('#result-status').textContent=`${groups[1].vnd.label} · ${status(1)} · ${status(2)}`;
 $('#result-status').className=`tag ${groups[1].vnd.unassigned||groups[2].vnd.unassigned?'red':'green'}`;
 $('#results-table').innerHTML='<table><thead><tr><th>K / Método</th><th>U</th><th>Inicial (média)</th><th>Final (média)</th><th>Melhora</th><th>Total (s)</th><th>Locais</th></tr></thead><tbody>'+[1,2].flatMap(K=>['vnd','tabu'].map(method=>{
  const x=groups[K][method];
  return `<tr><td>${K} / ${method.toUpperCase()}</td><td>${x.unassigned}</td><td>${fmt(x.initial)} ± ${fmt(x.initial_std)}</td><td>${fmt(x.final)} ± ${fmt(x.std)}</td><td>${fmt(x.improvement_pct)}%</td><td>${fmt(x.total_s,4)}</td><td>${fmt(x.schools,1)} / ${x.m}</td></tr>`
 })).join('')+'</tbody></table>';
 $('#precheck-detail').textContent='Pré-checagem por lote (s): '+[1,2].flatMap(K=>['vnd','tabu'].map(method=>`K=${K} ${method.toUpperCase()}: ${fmt(groups[K][method].precheck_s,4)}`)).join(' · ');
}
select.onchange=updateResults;select.value='Instancia2_G2.txt';updateResults();
function drawCurve(){const activeCurves=curves[$('#curve-k-select').value];$('#curve-k-label').textContent='K='+$('#curve-k-select').value;const w=600,h=350,p={l:78,r:20,t:24,b:52},vals=[...activeCurves.vnd,...activeCurves.tabu],lo=Math.min(...vals)*.995,hi=Math.max(...vals)*1.005;const n=activeCurves.vnd.length-1,x=i=>p.l+i/n*(w-p.l-p.r),y=v=>h-p.b-(v-lo)/(hi-lo)*(h-p.t-p.b);let content='';for(let k=0;k<5;k++){let v=lo+(hi-lo)*k/4;content+=`<line x1="${p.l}" y1="${y(v)}" x2="${w-p.r}" y2="${y(v)}" stroke="#dedfd8"/><text x="${p.l-10}" y="${y(v)+4}" text-anchor="end" fill="#676b64" font-size="12">${fmt(v,0)}</text>`}for(const i of [0,Math.round(n/3),Math.round(2*n/3),n])content+=`<text x="${x(i)}" y="${h-25}" text-anchor="middle" font-size="12" fill="#676b64">${i}</text>`;for(const [method,color] of [['vnd','#346538'],['tabu','#9f2f2d']]){let points=activeCurves[method].map((v,i)=>`${x(i)},${y(v)}`).join(' ');content+=`<polyline points="${points}" fill="none" stroke="${color}" stroke-width="3"/>`}content+='<text x="82" y="16" fill="#346538" font-size="13">— VND</text><text x="180" y="16" fill="#9f2f2d" font-size="13">— TABU</text><text x="340" y="346" text-anchor="middle" font-size="12" fill="#676b64">Iterações</text>';$('#convergence-chart').innerHTML=`<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Convergência em I1 G1: melhor distância média por iteração, VND e Busca Tabu"><title>Convergência em I1 G1</title>${content}</svg>`}
$('#curve-k-select').onchange=drawCurve;drawCurve();const initial=Number(location.hash.slice(1));show(Number.isInteger(initial)&&initial>=1&&initial<=slides.length?initial-1:0);
</script>
</body></html>
